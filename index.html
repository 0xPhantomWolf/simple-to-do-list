<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow-lg rounded-4">
      <div class="card-body">
        <h3 class="text-center mb-4">📌 To-Do List</h3>
        
        <!-- Input -->
        <div class="input-group mb-3">
          <input type="text" id="taskInput" class="form-control" placeholder="Enter your task...">
          <button class="btn btn-primary" id="addBtn">Add</button>
        </div>
        
        <!-- Task List -->
        <ul class="list-group" id="taskList"></ul>
        <!-- Task List -->
<ul class="list-group mb-3" id="taskList"></ul>

<!-- Clear All Button -->
<div class="text-center">
  <button class="btn btn-outline-danger" id="clearAllBtn">Clear All Tasks</button>
</div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
